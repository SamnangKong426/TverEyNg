name: server CI/CD Pipeline

on:
  push:
    branches: [main, master, server]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:  
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check . 

      - name: Check Formatting with Ruff
        run: ruff format . --check

      - name: Run tests
        run: pytest 

      - name: Run tests with coverage (Terminal Output)
        run: pytest --cov=. --cov-report=term-missing

      - name: Build Docker Image
        run: docker build -t server:latest .

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/server'
    steps:
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          deploy_url: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
          