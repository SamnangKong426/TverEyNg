name: CI/CD Pipeline

on:
  push:
    branches: [main, master, server, telegram-bot]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:  
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.TELEGRAM_GROUP_ID }}" >> .env

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check . 

      - name: Check Formatting with Ruff
        run: ruff format . --check

      - name: Run tests
        run: pytest 

      - name: Run tests with coverage (Terminal Output)
        run: pytest --cov=. --cov-report=term-missing

      - name: Build Docker Image
        run: docker build -t telegram-bot:latest .
          