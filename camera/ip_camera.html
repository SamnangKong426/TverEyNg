<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: "Ubuntu";
      }
    </style>
  </head>
  <body class="contianer p-10">
    <div class="h-auto max-w-full">
      <canvas
        id="canvas"
        width="640"
        height="480"
        class="rounded-lg border"
      ></canvas>
      <audio
        id="audioPlayer"
        class=""
        src="assets/thief_sound.mp3"
        preload="auto"
      ></audio>
    </div>
  </body>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const video = document.createElement("video");
    video.autoplay = true;
    video.playsInline = true;

    const audio = document.getElementById("audioPlayer");

    let latestDetections = [];

    let lastSpoken = 0;
    const cooldown = 1500; // speak every 1.5 seconds max

    // const url = "http://localhost:8000/upload";
    const url = "https://t2tn1f9r-8000.asse.devtunnels.ms/upload";

    /**
     * Get camera permission
     * @param {boolean} useVideo - capture video
     * @param {boolean} useAudio - capture audio
     */
    function askCameraPermission(useVideo = true, useAudio = false) {
      navigator.mediaDevices
        .getUserMedia({ video: useVideo, audio: useAudio })
        .then((stream) => {
          video.srcObject = stream;
          video.play();
          displayFrame();
        });
    }

    /**
     * Display camera frame
     * return {blob} - the recently capture frame
     */
    function displayFrame() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      drawBoundingBox(latestDetections);
      requestAnimationFrame(displayFrame);
    }

    /**
     * Draw rectangle around the detected object
     * @param {object} detections - object detection data (cls, conf, xyxy)
     * @param {ctx} canvas ctx - HTMLelement
     */
    function drawBoundingBox(detections) {
      detections.forEach((det) => {
        const [x1, y1, x2, y2] = det.xyxy;
        const label = det.cls;

        // det.cls == 0 ? textToSpeech("Warning! Person detected.") : null;

        // Draw rectangle
        ctx.strokeStyle = "red";
        ctx.lineWidth = 2;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

        // Draw label
        ctx.fillStyle = "red";
        ctx.font = "18px Arial";
        ctx.fillText(`${label} ${det.conf.toFixed(2)}`, x1, y1 - 5);
      });
    }

    function captureFrame() {
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), "image/jpeg");
      });
    }

    /**
     * Send real-time caputer frame
     */
    function sendFrame() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => {
        const reader = new FileReader();
        reader.onload = () => ws.send(reader.result.split(",")[1]);
        reader.readAsDataURL(blob);
      }, "image/jpeg");
      requestAnimationFrame(sendFrame);
    }

    /**
     * Send request to server to predict image
     * @param {Image} image - image you want to send
     * @return {object} the human dectection results
     */
    async function predictImageFrame(blob) {
      // clear old detecions data
      latestDetections.length = 0;

      const form = new FormData();
      form.append("frame", blob, "frame.jpg");

      try {
        const res = await fetch(url, {
          method: "POST",
          body: form,
        });
        const data = await res.json();
        return data.detections || [];
      } catch (err) {
        console.log(err);

        // Clear
        latestDetections = [];
        stopSpeech();
        audio.pause();
      }
    }

    async function processFrame() {
      const frame = await captureFrame();
      const detections = await predictImageFrame(frame);
      if (detections) latestDetections = detections;

      const now = Date.now();

      const personDetected =
        detections && detections.some((det) => det.cls == 0);

      if (personDetected) {
        // Speak only if cooldown passed
        if (now - lastSpoken > cooldown) {
          // textToSpeech("Warning! Person detected.");
          // lastSpoken = now;

          audio.play();
        }
      } else {
        // If no person, stop queued speech
        // stopSpeech();
        audio.pause();
      }

      setTimeout(processFrame, 3000);
    }
    /**
     * Text to speech
     * @param {string} text - the text you want to convert to speech
     */
    function textToSpeech(text) {
      const utterance = new SpeechSynthesisUtterance(text);

      // settings
      utterance.lang = "en-US"; // language
      utterance.rate = 1; // speed (0.1 to 10)
      utterance.pitch = 1; // pitch (0 to 2)
      utterance.volume = 1; // volume (0 to 1)

      speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      speechSynthesis.cancel();
    }

    // START
    askCameraPermission();
    processFrame();
  </script>
</html>
